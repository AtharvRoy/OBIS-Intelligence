<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBIS | Business Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-print-color-adjust: exact; margin: 0; padding: 0; background-color: #f8fafc; }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { 
                display: block !important; 
                position: static !important;
                width: 100% !important;
                visibility: visible !important;
                background: white !important;
            }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            
            .pdf-page {
                page-break-after: always !important;
                break-after: page !important;
                padding: 3rem !important;
                height: 297mm;
                width: 210mm;
                margin: 0 auto;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                position: relative;
            }

            .pdf-section { 
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 3rem !important;
            }
            
            .pdf-card {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                border: 1px solid #e2e8f0 !important;
                border-radius: 2.5rem !important;
                padding: 2rem !important;
                background: #f8fafc !important;
                margin-bottom: 1.5rem;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }
            
            .print-text-huge { font-size: 3.5rem !important; line-height: 1 !important; }
            .print-text-large { font-size: 2rem !important; }
            .print-text-med { font-size: 1.25rem !important; }
        }
        
        .print-only { display: none; }
    </style>
